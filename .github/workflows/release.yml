name: Build & Release SeleneTeX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SeleneTeX-linux-x86_64
            build_args: "--onefile"
          - os: windows-latest
            artifact_name: SeleneTeX-windows-x86_64.exe
            build_args: "--onefile"
          - os: macos-latest
            artifact_name: SeleneTeX-macos-arm64.zip
            build_args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Build executable
        run: python build_release.py ${{ matrix.build_args }}

      - name: Prepare Linux artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p release_assets
          cp dist/SeleneTeX release_assets/${{ matrix.artifact_name }}
          chmod +x release_assets/${{ matrix.artifact_name }}

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          Copy-Item dist\SeleneTeX.exe release_assets\${{ matrix.artifact_name }}

      - name: Prepare macOS artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p release_assets
          ditto -c -k --sequesterRsrc --keepParent dist/SeleneTeX.app release_assets/${{ matrix.artifact_name }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release_assets/*
